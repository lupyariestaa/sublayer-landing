<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f7f8"/>
      <stop offset="100%" stop-color="#eceef3"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f56ff"/>
      <stop offset="60%" stop-color="#7a4df0"/>
      <stop offset="100%" stop-color="#35cde8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4f56ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#4f56ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbfbfd"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="880" cy="120" r="360" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(88, 74)">
    <rect width="52" height="52" rx="15" fill="url(#mark)"/>
    <g fill="#fff">
      <rect x="15" y="12.5" width="22" height="5.7" rx="2.85" opacity="0.55"/>
      <rect x="12" y="22" width="28" height="5.85" rx="2.925" opacity="0.85"/>
      <rect x="15.6" y="32" width="20.8" height="5.7" rx="2.85" opacity="0.5"/>
    </g>
  </g>
  <text x="158" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#08080b" letter-spacing="-1.4">Sublayer</text>

  <!-- Headline -->
  <text x="88" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="70" font-weight="700" fill="#08080b" letter-spacing="-3.4">Stop losing revenue</text>
  <text x="88" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="70" font-weight="700" fill="#4f56ff" letter-spacing="-3.4">to failed renewals</text>
  <text x="88" y="424" font-family="Inter, Segoe UI, sans-serif" font-size="27" font-weight="400" fill="#6b6b7b">Subscription revenue infrastructure for modern commerce teams.</text>

  <!-- Mini stat card -->
  <g transform="translate(88, 476)">
    <rect width="1024" height="92" rx="20" fill="url(#card)" stroke="#e3e3e9"/>
    <text x="34" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#8d8d9c">Recurring volume processed</text>
    <text x="34" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#08080b" letter-spacing="-1.2">$4.1B</text>
    <line x1="300" y1="22" x2="300" y2="70" stroke="#e3e3e9"/>
    <text x="332" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#8d8d9c">Fewer failed renewals</text>
    <text x="332" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#08080b" letter-spacing="-1.2">41%</text>
    <line x1="596" y1="22" x2="596" y2="70" stroke="#e3e3e9"/>
    <text x="628" y="40" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#8d8d9c">Billing API uptime</text>
    <text x="628" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#08080b" letter-spacing="-1.2">99.99%</text>
  </g>
</svg>
